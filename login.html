<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parry Security | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal:       #0d9488;
  --teal-light: #ccfbf1;
  --teal-mid:   #14b8a6;
  --navy:       #0f172a;
  --ink:        #1e293b;
  --muted:      #64748b;
  --faint:      #94a3b8;
  --border:     #e2e8f0;
  --surface:    #f8fafc;
  --white:      #ffffff;
  --red:        #ef4444;
  --red-light:  #fee2e2;
  --amber:      #f59e0b;
  --amber-light:#fef3c7;
  --green:      #10b981;
  --green-light:#d1fae5;
  --indigo:     #6366f1;
  --indigo-light:#eef2ff;
  --purple:     #8b5cf6;
  --purple-light:#ede9fe;
  --radius-sm:  8px;
  --radius-md:  14px;
  --radius-lg:  22px;
  --shadow-xs:  0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:  0 4px 16px rgba(15,23,42,.07);
  --shadow-md:  0 8px 32px rgba(15,23,42,.10);
  --shadow-lg:  0 25px 50px -12px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family:'Figtree',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  line-height:1.6;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Gradient Background */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, rgba(13,148,136,.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 110%, rgba(99,102,241,.05) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

.container {
  max-width: 480px;
  width: 100%;
  margin: 2rem auto;
  padding: 0 1.5rem;
  position: relative;
  z-index: 1;
}

/* Logo Section */
.logo-section {
  text-align: center;
  margin-bottom: 1.8rem;
  animation: fadeInDown 0.6s ease;
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo-icon {
  font-size: 3rem;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 20px rgba(13,148,136,0.2));
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.logo-section h1 {
  font-family: 'Sora', sans-serif;
  font-size: 1.6rem;
  background: linear-gradient(135deg, #1e3a5f, #0d9488, #10b981);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  margin-top: 0.5rem;
}

.logo-section p {
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 0.2rem;
}

/* Login Card */
.login-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 2rem;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}

.card-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.card-header h2 {
  font-family: 'Sora', sans-serif;
  font-size: 1.5rem;
  color: var(--navy);
  margin-bottom: 0.3rem;
}

.card-header p {
  color: var(--muted);
  font-size: 0.85rem;
}

/* Form Styles */
.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.4rem;
  font-weight: 600;
  color: var(--ink);
  font-size: 0.8rem;
}

.input-icon {
  position: relative;
}

.input-icon span {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  color: var(--faint);
}

.input-icon input {
  width: 100%;
  padding: 0.8rem 1rem 0.8rem 2.8rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-family: inherit;
  transition: all 0.3s ease;
  background: var(--white);
}

.input-icon input:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
}

.input-icon input.error {
  border-color: var(--red);
}

.error-message {
  color: var(--red);
  font-size: 0.7rem;
  margin-top: 0.3rem;
  display: block;
}

/* Buttons */
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--teal), var(--teal-mid));
  color: white;
  border: none;
  padding: 0.85rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 0.3rem;
  font-family: 'Figtree', sans-serif;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(13,148,136,0.3);
}

.signup-link {
  text-align: center;
  margin-top: 1.2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.signup-link a {
  color: var(--teal);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.85rem;
}

.signup-link a:hover {
  text-decoration: underline;
}

/* Demo Info */
.demo-info {
  margin-top: 1.2rem;
  padding: 0.8rem;
  background: var(--surface);
  border-radius: var(--radius-md);
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  border: 1px solid var(--border);
}

.demo-info strong {
  color: var(--teal);
}

footer {
  text-align: center;
  margin-top: 1.5rem;
  color: var(--faint);
  font-size: 0.65rem;
}

/* ============================================
   PROFESSIONAL MODAL POPUP
   ============================================ */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-container {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 420px;
  width: 90%;
  overflow: hidden;
  animation: modalPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  box-shadow: var(--shadow-lg);
}

@keyframes modalPop {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Modal Header */
.modal-header {
  background: linear-gradient(135deg, var(--teal), var(--purple));
  padding: 1.2rem;
  text-align: center;
  position: relative;
}

.modal-header-icon {
  font-size: 3rem;
  margin-bottom: 0.3rem;
}

.modal-header h3 {
  font-family: 'Sora', sans-serif;
  font-size: 1.2rem;
  color: white;
  margin-bottom: 0.2rem;
}

.modal-header p {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.8);
}

/* Modal Body */
.modal-body {
  padding: 1.5rem;
  text-align: center;
}

.welcome-message {
  margin-bottom: 1rem;
}

.welcome-message .greeting {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--navy);
  font-family: 'Sora', sans-serif;
}

.welcome-message .username {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--teal), var(--purple));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  margin-top: 0.3rem;
}

.login-stats {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin: 1rem 0;
  border: 1px solid var(--border);
}

.stat-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border);
}

.stat-item:last-child {
  border-bottom: none;
}

.stat-label {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 500;
}

.stat-value {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--teal);
}

.progress-preview {
  margin: 1rem 0;
}

.progress-label {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 0.3rem;
  display: flex;
  justify-content: space-between;
}

.progress-bar-bg {
  background: var(--border);
  border-radius: 20px;
  height: 6px;
  overflow: hidden;
}

.progress-bar-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--purple));
  border-radius: 20px;
  transition: width 1s ease;
}

.next-step {
  background: linear-gradient(135deg, var(--indigo-light), var(--teal-light));
  border-radius: var(--radius-md);
  padding: 0.8rem;
  margin-top: 1rem;
}

.next-step p {
  font-size: 0.75rem;
  color: var(--navy);
}

.next-step strong {
  color: var(--teal);
}

/* Modal Footer */
.modal-footer {
  padding: 1rem 1.5rem 1.5rem;
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.modal-btn {
  background: linear-gradient(135deg, var(--teal), var(--purple));
  color: white;
  border: none;
  padding: 0.7rem 2rem;
  border-radius: 40px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Figtree', sans-serif;
}

.modal-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.modal-btn-secondary {
  background: var(--white);
  color: var(--teal);
  border: 2px solid var(--teal);
}

.modal-btn-secondary:hover {
  background: var(--teal-light);
}

@media (max-width: 600px) {
  .container { padding: 0 1rem; margin: 1rem auto; }
  .login-card { padding: 1.5rem; }
  .card-header h2 { font-size: 1.3rem; }
  .logo-section h1 { font-size: 1.4rem; }
  .logo-icon { font-size: 2.5rem; }
  .welcome-message .greeting { font-size: 1.3rem; }
  .welcome-message .username { font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="logo-section">
    <div class="logo-icon">🛡️</div>
    <h1>Parry Security</h1>
    <p>Your Digital Shield – Empowering Safe Online Choices</p>
  </div>

  <div class="login-card">
    <div class="card-header">
      <h2>Welcome Back</h2>
      <p>Login to continue your cyber safety training</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>📧 Email Address</label>
        <div class="input-icon">
          <span>📧</span>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="off">
        </div>
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="form-group">
        <label>🔒 Password</label>
        <div class="input-icon">
          <span>🔒</span>
          <input type="password" id="password" placeholder="Enter your password">
        </div>
        <span class="error-message" id="passwordError"></span>
      </div>

     <button type="submit" class="btn-primary">🔐 Login →</button>

<div class="forgot-link" style="text-align: right; margin-top: 0.5rem;">
  <a href="forgot-password.html" style="color: var(--teal); font-size: 0.75rem; text-decoration: none;">Forgot Password?</a>
</div>

<div class="signup-link">
    </form>
    <div class="signup-link">
      Don't have an account? <a href="index.html">Sign up here</a>
    </div>
  <footer>
    🛡️ Parry Security – Protecting you from online threats
  </footer>
</div>

<!-- PROFESSIONAL MODAL POPUP -->
<div class="modal-overlay" id="welcomeModal">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-header-icon">🎉</div>
      <h3>Welcome Back!</h3>
      <p>Login Successful</p>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Dynamic content will be inserted here -->
    </div>
    <div class="modal-footer">
      <button class="modal-btn" id="modalContinueBtn">Continue to Training →</button>
    </div>
  </div>
</div>

<script>
  // Get user's lesson completion progress
  function getUserProgress() {
    let completed = 0;
    for (let i = 1; i <= 6; i++) {
      if (localStorage.getItem(`parryLesson${i}Completed`) === 'true') {
        completed++;
      }
    }
    return { completed, total: 6, percent: Math.round((completed / 6) * 100) };
  }

  // Get next lesson based on progress
  function getNextLesson(progress) {
    if (progress.completed === 0) return { name: 'Lesson 1: Phishing & Suspicious Links', url: 'lesson1.html' };
    if (progress.completed === 1) return { name: 'Lesson 2: Social Engineering', url: 'lesson2.html' };
    if (progress.completed === 2) return { name: 'Lesson 3: Risky Online Behaviour', url: 'lesson3.html' };
    if (progress.completed === 3) return { name: 'Lesson 4: Password Security', url: 'lesson4.html' };
    if (progress.completed === 4) return { name: 'Lesson 5: Public Wi-Fi & Mobile', url: 'lesson5.html' };
    if (progress.completed === 5) return { name: 'Lesson 6: Data Privacy', url: 'lesson6.html' };
    return { name: 'Final Quiz', url: 'quiz.html' };
  }

  // Show professional modal
  function showWelcomeModal(userName, progress, nextLesson) {
    const modal = document.getElementById('welcomeModal');
    const modalBody = document.getElementById('modalBody');
    
    // Get current date and time
    const now = new Date();
    const hour = now.getHours();
    let greeting = 'Good Morning';
    if (hour >= 12 && hour < 18) greeting = 'Good Afternoon';
    if (hour >= 18) greeting = 'Good Evening';
    
    // Get login time
    const loginTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const loginDate = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    
    modalBody.innerHTML = `
      <div class="welcome-message">
        <div class="greeting">${greeting},</div>
        <div class="username">${userName}</div>
      </div>
      
      <div class="login-stats">
        <div class="stat-item">
          <span class="stat-label">📅 Login Date</span>
          <span class="stat-value">${loginDate}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">⏰ Login Time</span>
          <span class="stat-value">${loginTime}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">📚 Training Progress</span>
          <span class="stat-value">${progress.completed}/${progress.total} Lessons</span>
        </div>
      </div>
      
      <div class="progress-preview">
        <div class="progress-label">
          <span>Overall Completion</span>
          <span>${progress.percent}%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${progress.percent}%;"></div>
        </div>
      </div>
      
      <div class="next-step">
        <p>🎯 <strong>Next Step:</strong> Continue with <strong>${nextLesson.name}</strong></p>
        <p style="font-size: 0.65rem; margin-top: 0.3rem;">Your progress is automatically saved. Click continue to resume training.</p>
      </div>
    `;
    
    modal.classList.add('active');
    
    // Handle continue button
    const continueBtn = document.getElementById('modalContinueBtn');
    const newBtn = continueBtn.cloneNode(true);
    continueBtn.parentNode.replaceChild(newBtn, continueBtn);
    newBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      window.location.href = nextLesson.url;
    });
    
    // Close on outside click
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.classList.remove('active');
        window.location.href = nextLesson.url;
      }
    });
  }

  // Show error modal
  function showErrorModal(message) {
    const modal = document.getElementById('welcomeModal');
    const modalBody = document.getElementById('modalBody');
    const modalHeader = document.querySelector('.modal-header');
    
    modalHeader.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
    modalHeader.querySelector('.modal-header-icon').textContent = '⚠️';
    modalHeader.querySelector('h3').textContent = 'Login Failed';
    modalHeader.querySelector('p').textContent = 'Please check your credentials';
    
    modalBody.innerHTML = `
      <div style="text-align: center; padding: 0.5rem 0;">
        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔐</div>
        <p style="color: var(--muted); margin-bottom: 1rem;">${message}</p>
        <div class="demo-info" style="margin-top: 0.5rem;">
          <p>🔐 <strong>Demo Account</strong></p>
          <p>Email: <strong>demo@parrysecurity.com</strong> | Password: <strong>demo123</strong></p>
        </div>
      </div>
    `;
    
    const footer = document.querySelector('.modal-footer');
    footer.innerHTML = `<button class="modal-btn" id="modalErrorCloseBtn">Try Again</button>`;
    
    modal.classList.add('active');
    
    const closeBtn = document.getElementById('modalErrorCloseBtn');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        // Reset header
        modalHeader.style.background = 'linear-gradient(135deg, var(--teal), var(--purple))';
        modalHeader.querySelector('.modal-header-icon').textContent = '🎉';
        modalHeader.querySelector('h3').textContent = 'Welcome Back!';
        modalHeader.querySelector('p').textContent = 'Login Successful';
        footer.innerHTML = `<button class="modal-btn" id="modalContinueBtn">Continue to Training →</button>`;
      });
    }
    
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.classList.remove('active');
        modalHeader.style.background = 'linear-gradient(135deg, var(--teal), var(--purple))';
        modalHeader.querySelector('.modal-header-icon').textContent = '🎉';
        modalHeader.querySelector('h3').textContent = 'Welcome Back!';
        modalHeader.querySelector('p').textContent = 'Login Successful';
        footer.innerHTML = `<button class="modal-btn" id="modalContinueBtn">Continue to Training →</button>`;
      }
    });
  }

  // Login form submission
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Clear previous errors
    document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
    document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    let isValid = true;
    
    if (!email) {
      document.getElementById('emailError').textContent = 'Email is required';
      document.getElementById('email').classList.add('error');
      isValid = false;
    }
    
    if (!password) {
      document.getElementById('passwordError').textContent = 'Password is required';
      document.getElementById('password').classList.add('error');
      isValid = false;
    }
    
    if (!isValid) return;
    
    // Get users from localStorage
    const users = JSON.parse(localStorage.getItem('parryUsers') || '[]');
    const user = users.find(u => u.email === email && u.password === password);
    
    if (user) {
      // Set current user
      localStorage.setItem('parryCurrentUser', JSON.stringify({
        email: user.email,
        fullName: user.fullName,
        loginTime: new Date().toISOString()
      }));
      // Save name for certificate
      localStorage.setItem('parryTraineeName', user.fullName);
      
      // Get progress and next lesson
      const progress = getUserProgress();
      const nextLesson = getNextLesson(progress);
      
      // Show professional modal instead of alert
      showWelcomeModal(user.fullName, progress, nextLesson);
    } else {
      showErrorModal('Invalid email or password. Please try again.');
    }
  });
</script>
</body>
</html>
